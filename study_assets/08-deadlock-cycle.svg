<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
<title id="title">서로의 열쇠를 쥐고 기다린다 — 로그로 복원한 순환 대기</title>
<desc id="desc">앱 로그에 따르면 09:12:57,952 에 Worker-Thread-1 은 Shared_Memory_A 를, Worker-Thread-2 는 Socket_Pool_B 를 잡았다. 약 2초 뒤 Worker-Thread-2 는 A 를, Worker-Thread-1 은 B 를 기다리며 BLOCKED 가 되어 T1 → B → T2 → A → T1 고리가 닫혔고, 메인 스레드는 두 워커의 종료를 기다린다. 상호 배제·점유 대기·비선점·순환 대기 네 조건이 모두 성립했고, 락 순서를 통일하면 순환이 깨진다.</desc>
<style>
