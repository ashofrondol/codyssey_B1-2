<rect class="bg" x="0" y="0" width="820" height="520"/>
<text class="th" x="24" y="34">서로의 열쇠를 쥐고 기다린다 — 로그로 복원한 순환 대기</text>
<text class="ts" x="24" y="56">파랑 = 스레드 · 보라 = 자원(락) · 초록 실선 = 쥐고 있음 · 빨간 점선 = 기다리는 중 · 회색 점선 = 메인의 조인 대기</text>
<rect class="box" x="262" y="72" width="296" height="50" rx="10"/>
<text class="tb" x="410" y="92" text-anchor="middle">메인 <tspan class="mono">[AgentWorker]</tspan></text>
<text class="ts" x="410" y="112" text-anchor="middle">Waiting for worker threads… (조인 대기)</text>
<text class="ts" x="582" y="92">ps -L: 세 스레드 모두</text>
<text class="mono" x="582" y="111">futex_wait_queue</text>
<line class="ln dash" x1="300" y1="122" x2="206" y2="156" marker-end="url(#arrow)"/>
<line class="ln dash" x1="520" y1="122" x2="614" y2="156" marker-end="url(#arrow)"/>
<rect class="blue" x="80" y="160" width="200" height="52" rx="10"/>
<text class="mono tb c-blue" x="180" y="182" text-anchor="middle">Worker-Thread-1</text>
<text class="ts" x="180" y="202" text-anchor="middle">쥔 것 A · 원하는 것 B</text>
<rect class="blue" x="540" y="160" width="200" height="52" rx="10"/>
<text class="mono tb c-blue" x="640" y="182" text-anchor="middle">Worker-Thread-2</text>
<text class="ts" x="640" y="202" text-anchor="middle">쥔 것 B · 원하는 것 A</text>
<rect class="yellow" x="304" y="160" width="212" height="52" rx="10"/>
<text class="tb" x="410" y="181" text-anchor="middle">순환 고리</text>
<text x="410" y="202" text-anchor="middle">T1 → B → T2 → A → T1</text>
<rect class="purple" x="80" y="280" width="200" height="52" rx="10"/>
<text class="mono tb c-purple" x="180" y="302" text-anchor="middle">Shared_Memory_A</text>
<text class="ts" x="180" y="322" text-anchor="middle">자원 A (락 1개)</text>
<rect class="purple" x="540" y="280" width="200" height="52" rx="10"/>
<text class="mono tb c-purple" x="640" y="302" text-anchor="middle">Socket_Pool_B</text>
<text class="ts" x="640" y="322" text-anchor="middle">자원 B (락 1개)</text>
<line class="ln ln-green" x1="180" y1="280" x2="180" y2="216" marker-end="url(#arrow-green)"/>
<line class="ln ln-green" x1="640" y1="280" x2="640" y2="216" marker-end="url(#arrow-green)"/>
<text class="tb c-green" x="170" y="236" text-anchor="end">보유</text>
<text class="mono" x="170" y="253" text-anchor="end">LOCK ACQUIRED</text>
<text class="ts" x="170" y="270" text-anchor="end">09:12:57,952</text>
<text class="tb c-green" x="650" y="236">보유</text>
<text class="mono" x="650" y="253">LOCK ACQUIRED</text>
<text class="ts" x="650" y="270">09:12:57,952</text>
<path class="ln ln-red dash" d="M250,212 L250,234 L596,234 L596,276" marker-end="url(#arrow-red)"/>
<text class="ts c-red" x="423" y="256" text-anchor="middle">대기 · WAITING … BLOCKED  09:12:59,963</text>
<path class="ln ln-red dash" d="M740,186 L776,186 L776,356 L136,356 L136,336" marker-end="url(#arrow-red)"/>
<rect class="bg" x="309" y="343" width="294" height="26"/>
<text class="ts c-red" x="456" y="361" text-anchor="middle">대기 · WAITING … BLOCKED  09:12:59,955</text>
<rect class="box" x="24" y="380" width="772" height="116" rx="10"/>
<text class="ts" x="40" y="402">교착상태 4조건 (Coffman) — 네 개가 모두 성립했다</text>
<text x="40" y="428"><tspan class="tb">① 상호 배제</tspan><tspan class="ts"> — 락은 한 번에 한 스레드</tspan></text>
<text x="420" y="428"><tspan class="tb">② 점유 대기</tspan><tspan class="ts"> — 쥔 채로 하나 더 요청</tspan></text>
<text x="40" y="453"><tspan class="tb">③ 비선점</tspan><tspan class="ts"> — 남의 락을 뺏지 못함 (210초 뒤에도 그대로)</tspan></text>
<text x="420" y="453"><tspan class="tb">④ 순환 대기</tspan><tspan class="ts"> — 위 노란 고리</tspan></text>
<text class="tb c-green" x="40" y="480">하나만 깨도 풀린다 → 락 순서 통일 (모두 A 먼저, 그다음 B)</text>
</svg>
