<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" role="img" aria-labelledby="title desc">
<title id="title">살아 있지만 멈춤 진단 순서 — 넓게 보고 좁혀 간다</title>
<desc id="desc">프로세스가 살아 있는지, CPU 를 쓰며 도는지, 로그가 전진하는지, 모든 스레드가 futex 에서 멈췄는지, 로그의 락 획득·대기가 고리를 이루는지 순서로 확인해 교착상태를 확정한다. 각 단계에서 다른 답이 나오면 종료, CPU 폭주, 정상 대기, I/O 대기 같은 다른 결론으로 빠진다. MULTI_THREAD_ENABLE=false 대조군과 비교하고, 정상에서도 타임아웃되는 curl 은 판별 근거에서 제외한다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="820" height="620"/>
<text class="th" x="24" y="34">'살아 있지만 멈춤' 진단 순서 — 넓게 보고 좁혀 간다</text>
<text class="ts" x="24" y="56">파랑 = 확인 질문 · 초록 = 정상 · 주황 = 다른 문제 · 빨강 = 교착 확정 · 회색 점선 = 판별에서 제외</text>
<rect class="blue" x="24" y="76" width="440" height="52" rx="10"/>
<text class="tb c-blue" x="38" y="98">①</text>
<text class="mono" x="62" y="98">ps -ef | grep agent   /   kill -0 PID</text>
<text x="62" y="119">PID 가 살아 있나?</text>
<rect class="box" x="532" y="76" width="264" height="52" rx="10"/>
<text class="tb" x="664" y="98" text-anchor="middle">종료됨 → 종료 코드·마지막 로그</text>
<text class="ts" x="664" y="118" text-anchor="middle">(OOM 137 / CPU 143 경로)</text>
<line class="ln" x1="464" y1="102" x2="528" y2="102" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="95" text-anchor="middle">아니오</text>
<line class="ln ln-blue" x1="120" y1="128" x2="120" y2="152" marker-end="url(#arrow-blue)"/>
<text class="ts" x="130" y="147">예</text>
<rect class="blue" x="24" y="156" width="440" height="52" rx="10"/>
<text class="tb c-blue" x="38" y="178">②</text>
<text class="mono" x="62" y="178">ps -o stat,etime,time -p PID</text>
<text x="62" y="199">STAT 이 R 이고 TIME 이 늘어나나?</text>
<rect class="orange" x="532" y="156" width="264" height="52" rx="10"/>
<text class="tb c-orange" x="664" y="178" text-anchor="middle">무한 루프·CPU 폭주 의심</text>
<text class="ts" x="664" y="198" text-anchor="middle">계속 실행 중(R)</text>
<line class="ln" x1="464" y1="182" x2="528" y2="182" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="175" text-anchor="middle">예</text>
<line class="ln ln-blue" x1="120" y1="208" x2="120" y2="232" marker-end="url(#arrow-blue)"/>
<text class="ts" x="130" y="227">아니오</text>
<rect class="blue" x="24" y="236" width="440" height="52" rx="10"/>
<text class="tb c-blue" x="38" y="258">③</text>
<text class="mono" x="62" y="258">stat -c '%s bytes, mtime=%y' agent_app.log</text>
<text x="62" y="279">로그 크기·mtime 이 계속 바뀌나?</text>
<rect class="green" x="532" y="236" width="264" height="52" rx="10"/>
<text class="tb c-green" x="664" y="258" text-anchor="middle">느리지만 진행 중</text>
<text class="ts" x="664" y="278" text-anchor="middle">(정상 대기 — 멈춘 게 아님)</text>
<line class="ln" x1="464" y1="262" x2="528" y2="262" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="255" text-anchor="middle">예</text>
<line class="ln ln-blue" x1="120" y1="288" x2="120" y2="312" marker-end="url(#arrow-blue)"/>
<text class="ts" x="130" y="307">아니오</text>
<rect class="blue" x="24" y="316" width="440" height="52" rx="10"/>
<text class="tb c-blue" x="38" y="338">④</text>
<text class="mono" x="62" y="338">top -H -bn1 -p PID + ps -L -o lwp,stat,wchan:25</text>
<text x="62" y="359">모든 스레드가 futex 대기 + TIME+ 정지?</text>
<rect class="orange" x="532" y="316" width="264" height="52" rx="10"/>
<text class="tb c-orange" x="664" y="338" text-anchor="middle">D(I/O 대기) 등 다른 원인</text>
<text class="ts" x="664" y="358" text-anchor="middle">락 대기가 아님</text>
<line class="ln" x1="464" y1="342" x2="528" y2="342" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="335" text-anchor="middle">아니오</text>
<line class="ln ln-blue" x1="120" y1="368" x2="120" y2="392" marker-end="url(#arrow-blue)"/>
<text class="ts" x="130" y="387">예</text>
<rect class="blue" x="24" y="396" width="440" height="52" rx="10"/>
<text class="tb c-blue" x="38" y="418">⑤</text>
<text class="mono" x="62" y="418">tail agent_app.log</text>
<text x="62" y="439">LOCK ACQUIRED · WAITING for 가 고리를 이루나?</text>
<rect class="red" x="532" y="396" width="264" height="52" rx="10"/>
<text class="tb c-red" x="664" y="418" text-anchor="middle">교착상태 확정</text>
<text class="ts" x="664" y="438" text-anchor="middle">T1 → B → T2 → A → T1</text>
<line class="ln" x1="464" y1="422" x2="528" y2="422" marker-end="url(#arrow)"/>
<text class="ts" x="498" y="415" text-anchor="middle">예</text>
<rect class="zone" x="24" y="484" width="440" height="104" rx="10"/>
<text class="ts" x="40" y="506">판별에서 제외한 지표</text>
<text class="mono" x="40" y="530">curl --max-time 3 http://127.0.0.1:15034</text>
<text class="ts" x="40" y="554">정상 모드에서도 똑같이 타임아웃 (<tspan class="mono">curl_exit=28</tspan>)</text>
<text class="ts" x="40" y="575">→ 교착과 정상을 가르지 못하므로 근거에서 뺀다</text>
<rect class="box" x="532" y="484" width="264" height="104" rx="10"/>
<text class="tb" x="546" y="506">⑥ 대조군 — 같은 명령 한 번 더</text>
<text class="mono" x="546" y="530">MULTI_THREAD_ENABLE=false</text>
<text class="ts" x="546" y="554">futex 1 + do_select 2</text>
<text class="ts" x="546" y="575">TIME+ 전진 → 정상은 이렇게 보인다</text>
<line class="ln" x1="664" y1="484" x2="664" y2="452" marker-end="url(#arrow)"/>
<text class="ts" x="674" y="474">비교해서 차이 확인</text>
</svg>
