<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-labelledby="title desc">
<title id="title">같은 30초, 세 가지 CPU 숫자</title>
<desc id="desc">CPU_MAX_OCCUPY=80 으로 실행한 앱이 로그에 스스로 보고한 Current Load 는 5% 에서 53.27% 까지 올라 고정 종료선 50% 를 넘는 순간 종료됐다. 같은 시간 /proc 로 잰 이 프로세스의 실제 CPU 는 1초 구간 기준 최대 5% 였고, 호스트 전체 CPU 는 오르는 추세가 없었다. CPU_MAX_OCCUPY=80 선에는 닿지도 않았다. 그래프는 09:21 에 /proc 델타를 재려고 따로 띄운 실행이고, 오른쪽 상자의 top 값만 09:07 파이프라인 Before 실행의 것이다.</desc>
<style>
