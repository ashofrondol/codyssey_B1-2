<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">34초 동안의 메모리 — 프로세스는 250MB 늘었고 호스트는 거의 그대로</title>
<desc id="desc">MEMORY_LIMIT=256 으로 실행한 앱의 프로세스 메모리(PROC_RSS)는 3초마다 25MB 씩 17.7MB 에서 267.7MB 까지 올랐고, 앱 로그의 Current Heap 이 275MB 가 되어 256MB 한도를 넘는 순간 MemoryGuard 가 프로세스를 끝냈다(exit 137, 생존 0m34s). 같은 구간 호스트 전체 메모리 사용률은 37.4% 에서 37.8% 로 거의 변하지 않았다. 오른쪽 MEMORY_LIMIT=512 실행은 525MB 에 닿을 때마다 캐시를 비우고 다시 쌓으며 3분 동안 종료되지 않았다.</desc>
