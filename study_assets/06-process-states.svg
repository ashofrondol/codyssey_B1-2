<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
<title id="title">살아 있음 ≠ 일하고 있음 — 프로세스 상태와 이 과제에서 본 값</title>
<desc id="desc">리눅스 프로세스는 R(실행), S(깨울 수 있는 대기), D(깨울 수 없는 대기), T(정지), Z(좀비) 상태를 오간다. 이 과제의 OOM·CPU·데드락 앱 자식 프로세스는 모두 ps STAT 이 S 로 보였고, 데드락 자식 프로세스는 3스레드 모두 futex_wait_queue 에서 잠들어 있었다. 데드락은 좀비(Z)가 아니라 락을 기다리며 잠든 S 이며, 진짜 바쁜 루프만 R 100% 로 보인다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="820" height="460"/>
<text x="24.0" y="32.0" class="th">살아 있음 ≠ 일하고 있음 — 프로세스 상태와 이 과제에서 본 값</text>
<text x="24.0" y="54.0" class="ts">상자 = ps STAT 첫 글자 · 화살표 = 상태가 바뀌는 계기 · 말풍선 = 이 과제에서 실제로 본 값</text>
<line class="ln" x1="335.0" y1="214" x2="335.0" y2="140" marker-end="url(#arrow)"/>
<text x="343.0" y="181.0" class="mono">exit</text>
<line class="ln dash" x1="248" y1="108.0" x2="190" y2="108.0" marker-end="url(#arrow)"/>
<text x="182.0" y="104.0" text-anchor="end" class="ts">부모가 wait</text>
<text x="182.0" y="122.0" text-anchor="end" class="ts">→ 사라짐</text>
<line class="ln" x1="248" y1="232" x2="178" y2="232" marker-end="url(#arrow)"/>
<line class="ln" x1="176" y1="256" x2="246" y2="256" marker-end="url(#arrow)"/>
<text x="212.0" y="225.0" text-anchor="middle" class="mono">SIGSTOP</text>
<text x="212.0" y="276.0" text-anchor="middle" class="mono">SIGCONT</text>
<line class="ln" x1="422" y1="232" x2="622" y2="232" marker-end="url(#arrow)"/>
<line class="ln" x1="624" y1="256" x2="424" y2="256" marker-end="url(#arrow)"/>
<text x="523.0" y="198.0" text-anchor="middle" class="ts">락·타이머·I/O 를</text>
<text x="523.0" y="222.0" text-anchor="middle" class="ts">기다리며 잠듦</text>
<text x="523.0" y="276.0" text-anchor="middle" class="ts">깨움</text>
<text x="523.0" y="294.0" text-anchor="middle" class="ts">(FUTEX_WAKE · 시그널 · 타이머)</text>
<line class="ln" x1="311.0" y1="274" x2="311.0" y2="348" marker-end="url(#arrow)"/>
<line class="ln" x1="359.0" y1="350" x2="359.0" y2="276" marker-end="url(#arrow)"/>
<text x="303.0" y="317.0" text-anchor="end" class="ts">커널 안 I/O 대기</text>
<text x="367.0" y="317.0" class="ts">I/O 완료</text>
<rect class="blue" x="250" y="216" width="170" height="56" rx="10"/>
<text x="335.0" y="239.0" text-anchor="middle" class="tb c-blue">R · 실행</text>
<text x="335.0" y="260.0" text-anchor="middle" class="ts">실행 중 · 실행 대기</text>
<rect class="yellow" x="626" y="216" width="170" height="56" rx="10"/>
<text x="711.0" y="239.0" text-anchor="middle" class="tb ">S · 잠듦</text>
<text x="711.0" y="260.0" text-anchor="middle" class="ts">깨울 수 있는 대기</text>
<rect class="orange" x="225" y="352" width="220" height="56" rx="10"/>
<text x="335.0" y="375.0" text-anchor="middle" class="tb c-orange">D · 깊은 잠</text>
<text x="335.0" y="396.0" text-anchor="middle" class="ts">깨울 수 없는 대기 (디스크 등)</text>
<rect class="box" x="24" y="216" width="150" height="56" rx="10"/>
<text x="99.0" y="239.0" text-anchor="middle" class="tb ">T · 정지</text>
<text x="99.0" y="260.0" text-anchor="middle" class="ts">정지 (Ctrl+Z 등)</text>
<rect class="red" x="250" y="80" width="170" height="56" rx="10"/>
<text x="335.0" y="103.0" text-anchor="middle" class="tb c-red">Z · 좀비</text>
<text x="335.0" y="124.0" text-anchor="middle" class="ts">끝났는데 부모가 회수 안 함</text>
<line class="ln" x1="224" y1="163.0" x2="280" y2="214" stroke-width="1.2"/>
<rect class="box" x="24" y="138" width="200" height="50" rx="8"/>
<text x="36.0" y="158.0" class="mono">sh 바쁜 루프: R 100.0%</text>
<text x="36.0" y="178.0" class="ts">재실행 대조군</text>
<line class="ln" x1="420" y1="108.0" x2="450" y2="108.0" stroke-width="1.2"/>
<rect class="red" x="450" y="80" width="200" height="56" rx="8"/>
<text x="462.0" y="102.0" class="ts">이 과제에선 관측 없음</text>
<text x="462.0" y="122.0" class="tb c-red">데드락은 Z 가 아니라 S</text>
<line class="ln" x1="711.0" y1="272" x2="711.0" y2="326" stroke-width="1.2"/>
<rect class="yellow" x="546" y="326" width="250" height="96" rx="8"/>
<text x="558.0" y="348.0" class="mono">OOM 자식 프로세스: SN</text>
<text x="558.0" y="368.0" class="mono">CPU 자식 프로세스: SN</text>
<text x="558.0" y="388.0" class="mono">데드락 자식 프로세스: SNl</text>
<text x="558.0" y="408.0" class="ts">3스레드 모두 futex_wait_queue</text>
<text x="24.0" y="446.0" class="ts">STAT 수식자: N = nice 양수(앱이 nice=10 설정) · l = 멀티스레드</text>
</svg>
