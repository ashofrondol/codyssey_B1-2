<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" aria-labelledby="title desc">
<title id="title">00_run_experiments.sh oom 한 번이 거치는 함수들</title>
<desc id="desc">OOM 파이프라인이 사전 점검, Before(MEMORY_LIMIT=256) 실행과 반복 관측, 종료 흔적 수집, After(MEMORY_LIMIT=512) 재실행, 판정 순서로 함수를 부르는 흐름이다. 반복 관측 중 샘플과 스냅샷은 oom_monitor.log, oom_ps_top.txt, oom_app.log 에 기록되고, 2026-09-23 재실행 결과는 Before 0m33s 에서 After 0m49s 이상 생존으로 PASS 였다.</desc>
